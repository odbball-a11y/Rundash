name: Fetch Runalyze Data

on:
  schedule:
    # Every 15 minutes (GitHub's practical minimum; runs can start a few
    # minutes late). Health metrics are fetched incrementally, so this stays
    # inside Runalyze's API rate limit. Only commits when data changed.
    - cron: '*/15 * * * *'
  workflow_dispatch:  # Manual trigger from GitHub UI + the dashboard's Refresh button
    inputs:
      full_refresh:
        description: 'Re-download full health-metric history'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch all Runalyze data
        env:
          RUNALYZE_USERNAME: ${{ secrets.RUNALYZE_USERNAME }}
          RUNALYZE_PASSWORD: ${{ secrets.RUNALYZE_PASSWORD }}
          RUNALYZE_TOKEN: ${{ secrets.RUNALYZE_TOKEN }}
          FULL_REFRESH: ${{ inputs.full_refresh }}
        run: python fetch_all_data.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "🏃 Update Runalyze data $(date -u +%Y-%m-%d_%H:%M)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
