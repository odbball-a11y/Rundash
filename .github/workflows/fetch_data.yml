name: Fetch Runalyze Data

on:
  schedule:
    # Every 6 hours (UTC). Runalyze pulls new Garmin activities automatically,
    # so this keeps the dashboard close to your watch.
    - cron: '17 */6 * * *'
  workflow_dispatch:  # Manual trigger from GitHub UI + the dashboard's Refresh button

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch all Runalyze data
        env:
          RUNALYZE_USERNAME: ${{ secrets.RUNALYZE_USERNAME }}
          RUNALYZE_PASSWORD: ${{ secrets.RUNALYZE_PASSWORD }}
          RUNALYZE_TOKEN: ${{ secrets.RUNALYZE_TOKEN }}
        run: python fetch_all_data.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "🏃 Update Runalyze data $(date -u +%Y-%m-%d_%H:%M)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
